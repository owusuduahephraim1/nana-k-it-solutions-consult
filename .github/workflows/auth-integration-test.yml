name: Test production authentication integration

on:
  push:
    branches:
      - main
    paths:
      - ".auth-integration-test-trigger"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AUTH_URL: "https://ep-square-mountain-b56mr71c.neonauth.c-7.us-east-2.aws.neon.tech/neondb/auth"
      API_URL: "https://nana-k-it-solutions-consult-api.edusentia-enterprise-neon.workers.dev"
      SITE_ORIGIN: "https://owusuduahephraim1.github.io"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install database client
        working-directory: worker
        run: npm ci

      - name: Create isolated test client account
        run: |
          set -euo pipefail
          EMAIL="portal-test-$(date +%s)-$RANDOM@example.com"
          PASSWORD="NkT-$(openssl rand -hex 16)-Aa1!"
          echo "::add-mask::$PASSWORD"

          status="$(curl -sS -c /tmp/nanak-auth-cookies.txt -o /tmp/signup.json -w '%{http_code}'             -H 'Content-Type: application/json'             --data-binary "$(jq -nc --arg name 'Portal Integration Test' --arg email "$EMAIL" --arg password "$PASSWORD" '{name:$name,email:$email,password:$password}')"             "$AUTH_URL/sign-up/email")"

          if [ "$status" != "200" ] && [ "$status" != "201" ]; then
            cat /tmp/signup.json
            echo "Auth signup failed with HTTP $status"
            exit 1
          fi

          echo "TEST_EMAIL=$EMAIL" >> "$GITHUB_ENV"
          echo "Temporary auth account created."

      - name: Verify test email and create scoped ticket
        working-directory: worker
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import { neon } from '@neondatabase/serverless';
          const sql=neon(process.env.DATABASE_URL);
          const email=process.env.TEST_EMAIL;
          const users=await sql.query('UPDATE neon_auth."user" SET "emailVerified"=true WHERE lower(email)=lower($1) RETURNING id,email',[email]);
          if (!users[0]) throw new Error('Temporary auth user was not created in Neon.');
          const tickets=await sql.query(
            `INSERT INTO tickets(name,email,issue_type,description,priority,status)
             VALUES($1,$2,$3,$4,$5,$6)
             RETURNING id,ticket_number`,
            ['Portal Integration Test',email,'Software','Temporary production authentication integration test.','low','open']
          );
          fs.appendFileSync(process.env.GITHUB_ENV, `TEST_AUTH_USER_ID=${users[0].id}\nTEST_TICKET_ID=${tickets[0].id}\nTEST_TICKET_NUMBER=${tickets[0].ticket_number}\n`);
          console.log('Temporary client identity and ticket prepared.');
          EOF

      - name: Obtain Neon Auth JWT and test client isolation
        run: |
          set -euo pipefail
          token_json="$(curl -sS -b /tmp/nanak-auth-cookies.txt "$AUTH_URL/token")"
          TOKEN="$(printf '%s' "$token_json" | jq -r '.token // empty')"
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"

          me_code="$(curl -sS -o /tmp/client-me.json -w '%{http_code}'             -H "Origin: $SITE_ORIGIN"             -H "Authorization: Bearer $TOKEN"             "$API_URL/api/client/me")"
          test "$me_code" = "200"
          jq -e --arg email "$TEST_EMAIL" '.user.email == $email' /tmp/client-me.json >/dev/null

          tickets_code="$(curl -sS -o /tmp/client-tickets.json -w '%{http_code}'             -H "Origin: $SITE_ORIGIN"             -H "Authorization: Bearer $TOKEN"             "$API_URL/api/client/tickets")"
          test "$tickets_code" = "200"
          jq -e --arg number "$TEST_TICKET_NUMBER" '.data | any(.ticket_number == $number)' /tmp/client-tickets.json >/dev/null

          admin_code="$(curl -sS -o /tmp/admin-denied.json -w '%{http_code}'             -H "Origin: $SITE_ORIGIN"             -H "Authorization: Bearer $TOKEN"             "$API_URL/api/admin/overview")"
          test "$admin_code" = "403"

          echo "Client JWT verification, email scoping, and admin denial all passed."

      - name: Clean temporary ticket
        if: always()
        working-directory: worker
        run: |
          node --input-type=module <<'EOF'
          import { neon } from '@neondatabase/serverless';
          if (!process.env.DATABASE_URL || !process.env.TEST_EMAIL) process.exit(0);
          const sql=neon(process.env.DATABASE_URL);
          await sql.query('DELETE FROM tickets WHERE lower(email)=lower($1)',[process.env.TEST_EMAIL]);
          console.log('Temporary ticket cleaned.');
          EOF
