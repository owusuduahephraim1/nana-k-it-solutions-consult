name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  push:
    paths:
      - ".deploy-worker-trigger"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_URL: "https://nana-k-it-solutions-consult-api.edusentia-enterprise-neon.workers.dev"
      TURNSTILE_SITE_KEY: "0x4AAAAAAFWx04AEskoZCBMj"
      TURNSTILE_HOSTNAME: "owusuduahephraim1.github.io"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Validate Worker source
        run: npm run check

      - name: Validate Neon DATABASE_URL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          node --input-type=module <<'EOF'
          import { neon } from '@neondatabase/serverless';
          if (!process.env.DATABASE_URL) {
            console.error('DATABASE_URL is missing.');
            process.exit(1);
          }
          try {
            const parsed = new URL(process.env.DATABASE_URL);
            if (!/^postgres(ql)?:$/.test(parsed.protocol)) throw new Error('DATABASE_URL is not a PostgreSQL URI.');
            const sql = neon(process.env.DATABASE_URL);
            const rows = await sql`SELECT count(*)::int AS count FROM public.projects`;
            console.log('Neon connection OK. projects rows:', rows[0].count);
          } catch (error) {
            console.error('Neon connection failed:', error?.name || 'Error', error?.message || 'Unknown database connection error');
            process.exit(1);
          }
          EOF

      - name: Ensure production R2 bucket exists
        run: npx wrangler r2 bucket create nana-k-it-solutions-consult-assets || echo "Production R2 bucket already exists or will be validated during deploy."

      - name: Ensure preview R2 bucket exists
        run: npx wrangler r2 bucket create nana-k-it-solutions-consult-assets-dev || echo "Preview R2 bucket already exists or will be validated during deploy."

      - name: Deploy Worker
        run: npx wrangler deploy

      - name: Sync optional Worker secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          R2_UPLOAD_SECRET: ${{ secrets.R2_UPLOAD_SECRET }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            printf '%s' "$DATABASE_URL" | npx wrangler secret put DATABASE_URL
          else
            echo "DATABASE_URL GitHub secret is not set; skipping."
          fi
          if [ -n "$TURNSTILE_SECRET_KEY" ]; then
            printf '%s' "$TURNSTILE_SECRET_KEY" | npx wrangler secret put TURNSTILE_SECRET_KEY
          else
            echo "TURNSTILE_SECRET_KEY GitHub secret is not set; skipping."
          fi
          if [ -n "$R2_UPLOAD_SECRET" ]; then
            printf '%s' "$R2_UPLOAD_SECRET" | npx wrangler secret put R2_UPLOAD_SECRET
          else
            echo "R2_UPLOAD_SECRET GitHub secret is not set; skipping."
          fi

      - name: Provision and verify R2 upload secret
        run: |
          set -euo pipefail
          r2_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$r2_secret"
          printf '%s' "$r2_secret" | npx wrangler secret put R2_UPLOAD_SECRET

          printf 'Nana K R2 production smoke test\n' > /tmp/nanak-r2-smoke.txt

          upload_json=""
          for attempt in 1 2 3 4 5 6; do
            upload_json="$(curl -sS               -H "X-Admin-Upload-Key: $r2_secret"               -F "file=@/tmp/nanak-r2-smoke.txt;type=text/plain"               -F "folder=deployment-tests"               "$WORKER_URL/api/files/upload")"
            if echo "$upload_json" | jq -e '.key and .url' >/dev/null 2>&1; then
              break
            fi
            echo "Waiting for R2 upload secret rollout (attempt $attempt)..."
            sleep 3
          done

          key="$(echo "$upload_json" | jq -r '.key // empty')"
          url="$(echo "$upload_json" | jq -r '.url // empty')"
          test -n "$key"
          test -n "$url"

          curl -fsS "$url" -o /tmp/nanak-r2-smoke-downloaded.txt
          cmp /tmp/nanak-r2-smoke.txt /tmp/nanak-r2-smoke-downloaded.txt

          unauthorized_code="$(curl -sS -o /tmp/r2-unauthorized.json -w '%{http_code}'             -F "file=@/tmp/nanak-r2-smoke.txt;type=text/plain"             -F "folder=deployment-tests"             "$WORKER_URL/api/files/upload")"
          test "$unauthorized_code" = "401"

          npx wrangler r2 object delete "nana-k-it-solutions-consult-assets/$key"

          deleted_code=""
          for attempt in 1 2 3 4 5; do
            deleted_code="$(curl -sS -o /tmp/r2-deleted.txt -w '%{http_code}' "$url?deleted_check=$(date +%s%N)")"
            if [ "$deleted_code" = "404" ]; then
              break
            fi
            echo "Waiting for deleted R2 object to disappear from the public read path (attempt $attempt, HTTP $deleted_code)..."
            sleep 2
          done
          test "$deleted_code" = "404"

          echo "R2 upload secret, protected upload route, object read, and cleanup checks passed."

      - name: Validate Turnstile secret
        env:
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: |
          set -e
          test -n "$TURNSTILE_SECRET_KEY"
          curl -sS https://challenges.cloudflare.com/turnstile/v0/siteverify             -X POST             --data-urlencode "secret=$TURNSTILE_SECRET_KEY"             --data-urlencode "response=invalid-test-token" > /tmp/siteverify.json
          if jq -e '.["error-codes"] // [] | index("invalid-input-secret") or index("missing-input-secret")' /tmp/siteverify.json >/dev/null; then
            echo "Turnstile secret is invalid."
            exit 1
          fi
          echo "Turnstile secret accepted by Siteverify."

      - name: Ensure GitHub Pages hostname on Turnstile widget
        run: |
          set -e
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/challenges/widgets/$TURNSTILE_SITE_KEY"
          http_code="$(curl -sS -o /tmp/widget.json -w '%{http_code}' "$api"             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"

          if [ "$http_code" != "200" ] || ! jq -e '.success == true' /tmp/widget.json >/dev/null; then
            echo "Cloudflare API token cannot read the Turnstile widget; hostname management was not changed."
            exit 0
          fi

          if jq -e --arg host "$TURNSTILE_HOSTNAME" '.result.domains | index($host)' /tmp/widget.json >/dev/null; then
            echo "Turnstile hostname already configured: $TURNSTILE_HOSTNAME"
            exit 0
          fi

          jq --arg host "$TURNSTILE_HOSTNAME" '
            .result
            | {
                name,
                mode,
                domains: ((.domains + [$host]) | unique),
                bot_fight_mode,
                clearance_level,
                ephemeral_id,
                offlabel
              }
            | with_entries(select(.value != null))
          ' /tmp/widget.json > /tmp/widget-update.json

          update_code="$(curl -sS -o /tmp/widget-updated.json -w '%{http_code}' "$api"             -X PUT             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json"             --data-binary @/tmp/widget-update.json)"

          if [ "$update_code" != "200" ] || ! jq -e '.success == true' /tmp/widget-updated.json >/dev/null; then
            echo "Cloudflare API token can read but cannot update the Turnstile widget."
            exit 0
          fi

          jq -e --arg host "$TURNSTILE_HOSTNAME" '.result.domains | index($host)' /tmp/widget-updated.json >/dev/null
          echo "Turnstile hostname configured: $TURNSTILE_HOSTNAME"

      - name: Smoke test Worker and Turnstile gateway
        run: |
          set -e
          health_code="$(curl -sS -o /tmp/health.json -w '%{http_code}' "$WORKER_URL/api/health")"
          test "$health_code" = "200"
          projects_code="$(curl -sS -o /tmp/projects.json -w '%{http_code}' "$WORKER_URL/api/projects")"
          test "$projects_code" = "200"
          turnstile_code="$(curl -sS -o /tmp/turnstile.json -w '%{http_code}'             -H 'Content-Type: application/json'             -d '{"name":"Smoke Test","email":"smoke@example.com","subject":"Smoke Test","message":"Smoke Test"}'             "$WORKER_URL/api/contact")"
          if [ "$turnstile_code" != "400" ]; then
            echo "Expected Turnstile gateway to reject missing token with HTTP 400; received $turnstile_code"
            cat /tmp/turnstile.json
            exit 1
          fi
          grep -q "security verification" /tmp/turnstile.json
          echo "Worker health, Neon read, and Turnstile gateway checks passed."
