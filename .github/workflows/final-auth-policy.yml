name: Finalize admin authorization policy

on:
  push:
    branches:
      - production-readiness-2026-10-14
    paths:
      - ".final-auth-policy-trigger"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Keep verified-email admin allowlist
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("worker/src/backoffice.js")
          s=p.read_text()
          old="if(admin&&(!adminEmails(env).has(user.email)||String(user.role||'').toLowerCase()!=='admin')){"
          new="if(admin&&!adminEmails(env).has(user.email)){"
          if old not in s:
              raise SystemExit("Expected admin role policy pattern not found")
          p.write_text(s.replace(old,new))
          PY
      - name: Validate Worker
        run: |
          cd worker
          npm install
          npm run check
      - name: Commit final auth policy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/src/backoffice.js worker/package-lock.json
          git commit -m "Use verified email allowlist for administrator access"
          git push
