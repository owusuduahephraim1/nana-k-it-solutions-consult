name: Apply production readiness upgrade

on:
  push:
    branches:
      - production-readiness-2026-10-14
    paths:
      - ".production-upgrade-trigger"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production-readiness branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Reconstruct and verify upgrade archive
        run: |
          set -euo pipefail
          test -f .upgrade-parts/part01.b64
          cat .upgrade-parts/part*.b64 | base64 -d > /tmp/nanak-production-upgrade.zip
          echo "751ba62c5a5be50a7458b213c63727e148c3167806ee29a45097f0cc9b4ed01c  /tmp/nanak-production-upgrade.zip" | sha256sum -c -
          rm -rf /tmp/nanak-production-upgrade
          mkdir -p /tmp/nanak-production-upgrade
          unzip -q /tmp/nanak-production-upgrade.zip -d /tmp/nanak-production-upgrade
          test -f /tmp/nanak-production-upgrade/nanak-production-upgrade/worker/src/backoffice.js
          test -f /tmp/nanak-production-upgrade/nanak-production-upgrade/site/admin.html

      - name: Apply upgrade
        run: |
          set -euo pipefail
          SRC="/tmp/nanak-production-upgrade/nanak-production-upgrade"
          mkdir -p database docs scripts
          rsync -a "$SRC/worker/" worker/
          rsync -a "$SRC/site/" site/
          cp "$SRC/database/production-readiness-migration.sql" database/production-readiness-migration.sql
          cp "$SRC/docs/PRODUCTION_WORKSPACE.md" docs/PRODUCTION_WORKSPACE.md
          cp "$SRC/scripts/finalize-public.mjs" scripts/finalize-public.mjs
          node scripts/finalize-public.mjs

          rm -rf .upgrade-parts
          rm -f site/admin-preview.html
          rm -f worker/src/ping.mjs worker/src/fetch-helper.mjs worker/src/db-store.mjs
          rm -f worker/src/queries.json worker/src/queries-client.json worker/src/queries-public.json
          rm -f database/production-readiness-note.sql docs/ping.txt
          sed -i '/Production readiness workspace implementation in progress\./d' README.md

      - name: Validate production code
        run: |
          set -euo pipefail
          node --check worker/src/index.js
          node --check worker/src/backoffice.js
          node --check worker/src/turnstile-gateway.js
          node --check site/assets/js/admin.js
          node --check site/assets/js/auth-common.js
          node --check site/assets/js/client-portal.js
          node --check scripts/finalize-public.mjs
          cd worker
          npm install
          npm run check

      - name: Confirm expected production files
        run: |
          set -euo pipefail
          test -f site/admin.html
          test -f site/client-portal.html
          test -f site/remote-support.html
          test -f site/assets/css/workspace.css
          test -f database/production-readiness-migration.sql
          test -f docs/PRODUCTION_WORKSPACE.md
          ! grep -R "secure portal placeholder" -n site/client-portal.html

      - name: Commit upgraded workspace
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete Nana K production admin and client workspaces"
          git push
