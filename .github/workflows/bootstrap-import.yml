name: Bootstrap repository import

on:
  push:
    paths:
      - ".bootstrap-trigger"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Download bootstrap archive
        env:
          SHARE_URL: "https://firestorage.ai/en/f/iQb3zb_hBrr6"
          TARGET_NAME: "nana-k-it-solutions-consult-neon-import.zip"
        run: |
          cat > /tmp/download.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ acceptDownloads: true });
          const shareUrl = process.env.SHARE_URL;
          const targetName = process.env.TARGET_NAME;

          await page.goto(shareUrl, { waitUntil: 'domcontentloaded', timeout: 120000 });
          await page.waitForTimeout(8000);

          console.log('Page title:', await page.title());
          console.log('Body text:', (await page.locator('body').innerText()).slice(0, 8000));

          let clickable = page.getByText(targetName, { exact: false }).first();
          if (await clickable.count()) {
            const parentLink = clickable.locator('xpath=ancestor-or-self::a[1]');
            const parentButton = clickable.locator('xpath=ancestor-or-self::button[1]');
            if (await parentLink.count()) clickable = parentLink;
            else if (await parentButton.count()) clickable = parentButton;
          } else {
            const anchors = page.locator('a');
            const count = await anchors.count();
            for (let i = 0; i < count; i++) {
              const a = anchors.nth(i);
              const href = await a.getAttribute('href');
              const txt = (await a.innerText().catch(() => '')).trim();
              console.log('Anchor', i, txt, href);
            }
            const downloadLink = page.locator('a[download], a[href*="download"], button:has-text("Download")').first();
            if (await downloadLink.count()) clickable = downloadLink;
            else throw new Error('Could not locate the shared ZIP download control.');
          }

          const downloadPromise = page.waitForEvent('download', { timeout: 120000 });
          await clickable.click({ timeout: 60000 });
          const download = await downloadPromise;
          await download.saveAs('/tmp/package.zip');

          const stat = fs.statSync('/tmp/package.zip');
          console.log('Downloaded:', download.suggestedFilename(), stat.size, 'bytes');
          if (stat.size < 100000) throw new Error('Downloaded file is unexpectedly small.');

          await browser.close();
          EOF
          node /tmp/download.mjs

      - name: Import repository files
        run: |
          rm -rf /tmp/import
          mkdir -p /tmp/import
          unzip -q /tmp/package.zip -d /tmp/import
          SRC="/tmp/import/nana-k-it-solutions-consult-neon-version"
          test -f "$SRC/README.md"
          rsync -a --delete             --exclude='.git/'             --exclude='.github/'             --exclude='.bootstrap-trigger'             "$SRC/" ./

      - name: Commit imported project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Nana K IT Solutions Consult Neon version" || exit 0
          git push
