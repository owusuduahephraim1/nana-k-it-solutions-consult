name = "nana-k-it-solutions-consult-api"
main = "src/turnstile-gateway.js"
compatibility_date = "2026-08-01"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://owusuduahephraim1.github.io,https://nanakitsolutions.com,https://www.nanakitsolutions.com"
R2_PUBLIC_BASE_URL = "https://nana-k-it-solutions-consult-api.edusentia-enterprise-neon.workers.dev"
MAX_UPLOAD_BYTES = "20971520"

[[ratelimits]]
name = "FORM_RATE_LIMITER"
namespace_id = "842762001"

  [ratelimits.simple]
  limit = 5
  period = 60

[[ratelimits]]
name = "FORM_GLOBAL_RATE_LIMITER"
namespace_id = "842762002"

  [ratelimits.simple]
  limit = 60
  period = 60

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "nana-k-it-solutions-consult-assets"
preview_bucket_name = "nana-k-it-solutions-consult-assets-dev"
